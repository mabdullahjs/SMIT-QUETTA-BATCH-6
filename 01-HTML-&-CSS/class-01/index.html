    <!-- Forms -->
    <a href="./form.html">Forms</a>
    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter Your Name" required>
        <br> <br>
        <label>CNIC:</label>
        <input type="number" placeholder="Enter Your CNIC" required>
        <br> <br>
        <label>DOB:</label>
        <input type="date" required>
        <br> <br>
        <label>email</label>
        <input type="email" required>
        <br> <br>
        <label>password</label>
        <input type="password" required>
        <br> <br>
        <!-- Radio -->
        <label>Select Your Gender:</label>
        <input type="radio" name="gender" id="male" value="male">
        <label>Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label>Female</label>
        <input type="radio" name="gender" id="custom" value="custom">
        <label>Custom</label> <br> <br>

        <!-- CheckBox -->
        <label>What do you have?</label> <br>
        <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label> I have a bike</label><br>
        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label> I have a car</label><br>
        <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label> I have a boat</label> <br><br>

        <!-- Hobbies -->
        <label>Select your hobbies</label> <br><br>

        <input type="checkbox" id="swimming">
        <label for="swimming">swimming</label> <br>

        <input type="checkbox" id="cooking">
        <label for="cooking">cooking</label> <br>

        <input type="checkbox" id="riding">
        <label for="riding">riding</label> <br>

        <input type="checkbox" id="dancing">
        <label for="dancing">dancing</label> <br>

        <input type="checkbox" id="hiking">
        <label for="hiking">hiking</label> <br>

        <input type="checkbox" id="boating">
        <label for="boating">boating</label> <br>
    </form>
